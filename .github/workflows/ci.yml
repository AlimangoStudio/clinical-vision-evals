name: Python tests and public artifact checks
on:
  push:
  pull_request:
permissions:
  contents: read
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Run tests (no credentials, no external model calls)
        run: PYTHONPATH=src python -m unittest discover -s tests -v
      - name: Prevent private patient or production artifacts
        run: python scripts/check_public_artifacts.py
